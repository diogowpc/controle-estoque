<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Controle de Estoque</title>
</head>
<body>
    <div class="wrapper">
        <div class="screen-backdrop"></div>

        <div class="screen-home screen">
            <div class="head-wrapper">

                <div class="menu_btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
                    </svg>
                </div>

                <div class="welcome">
                    <div class="content">
                        <h1>Estoque</h1>
                        <p></p>
                    </div>

                    <div class="img">
                        <img src="img/boy.png" alt="avatar">
                        <div class="backdrop"></div>
                    </div>
                </div>

            </div>

            <!-- Categorias -->
            <div class="categorias-wrapper">
                <div class="categorias">

                    <div class="categoria">
                        <div class="left">
                            <img src="img/briefcase.png" alt="">
                            <div class="content">
                                <h1>Hortifruti</h1>
                                <p></p>
                            </div>
                        </div>

                        <div class="options">
                            <div class="toggle_btn">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
                                </svg>
                            </div>
                        </div>
                      
                    </div>

                    <div class="categoria">
                        <div class="left">
                            <img src="img/calendar.png" alt="">
                            <div class="content">
                                <h1>Açougue</h1>
                                <p></p>
                            </div>
                        </div>

                        <div class="options">
                            <div class="toggle_btn">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
                                </svg>
                            </div>
                        </div>
                      
                    </div>

                    <div class="categoria">
                        <div class="left">
                            <img src="img/dumbbell.png" alt="">
                            <div class="content">
                                <h1>Padaria</h1>
                                <p></p>
                            </div>
                        </div>

                        <div class="options">
                            <div class="toggle_btn">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
                                </svg>
                            </div>
                        </div>
                      
                    </div>

                    <div class="categoria">
                        <div class="left">
                            <img src="img/briefcase.png" alt="">
                            <div class="content">
                                <h1>Bebidas</h1>
                                <p></p>
                            </div>
                        </div>

                        <div class="options">
                            <div class="toggle_btn">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
                                </svg>
                            </div>
                        </div>
                    </div>

                     <div class="categoria">
                        <div class="left">
                            <img src="img/briefcase.png" alt="">
                            <div class="content">
                                <h1>Doces</h1>
                                <p></p>
                            </div>
                        </div>

                        <div class="options">
                            <div class="toggle_btn">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
                                </svg>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Tela de Categorias -->
        <div class="screen categorias-screen">
            
            <div class="head_wrapper">
                <div class="back_btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 15.75L3 12m0 0l3.75-3.75M3 12h18" />
                    </svg>
                </div>

                <div class="options">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
                        </svg>
                </div>
            </div>
        <div class="categoria-details">
            <span class="cat-icon" id="categoria-icon">📦</span>
            <div class="details">
                <p id="num-produtos"></p>
                <h1 id="categoria-titulo"></h1>
            </div>
        </div>
        <div class="produtos-wrapper">
            <div class="produtos">
            </div>
        </div>
</div>

    <div class="add-produto-btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 4.5v15m7.5-7.5h-15"
          />
        </svg>
    </div>

    <div class="back-backdrop"></div>

    <div class="add-produto">
        <div class="add-produto-backdrop"></div>
        <h1 class="heading">Adicionar produto</h1>
        <div class="input-group">
            <label for="produto-input">Nome do produto</label>
            <input type="text" id="produto-input" required>

            <label for="quantidade-input">Quantidade</label>
            <input type="number" id="quantidade-input" required>

            <label for="validade-input">Validade</label>
            <input type="date" id="validade-input" required>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
